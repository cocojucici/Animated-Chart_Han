<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment 02 · Highlight the Leading Terminal</title><link rel="stylesheet" href="style.css?v=3"></head>
<body class="assignment-page leader-assignment" data-assignment="2"><header><a class="brand" href="#">LAX <span>IN MOTION ↗</span></a><nav class="site-tabs" aria-label="Main navigation"><a href="index.html">Terminal chart</a><a href="assignment.html">Assignment <span>01</span></a><a href="assignment2.html" aria-current="page">Assignment <span>02</span></a></nav></header>
<main><section class="assignment-intro"><p class="eyebrow">WORKSHOP / ASSIGNMENT 02</p><h1>Leading <span>terminal.</span></h1></section>
<section class="workspace" id="assignment-demo"><form id="filters"><p class="eyebrow">LIVE DEMO / CURRENT MONTH · CURRENT FILTERS</p><div class="fields"><label>Start month<select id="start"></select></label><label>End month<select id="end"></select></label><label>Passenger movement<select id="movement"><option value="All">All · Arrivals + departures</option><option value="Arrival">Arrivals</option><option value="Departure">Departures</option></select></label><label>Travel market<select id="market"><option value="All">All · Domestic + international</option><option>Domestic</option><option>International</option></select></label><button id="apply" class="primary">Apply filters ↗</button></div><p id="pending" hidden>Selection changed. Apply filters to update the chart.</p></form>
<p id="error" role="alert" hidden></p><section class="chart-card"><div class="chart-heading"><div><h2>Monthly terminal ranking</h2><p id="context">Loading data…</p></div><div><strong id="current">—</strong><span id="frameCount"></span></div></div><div class="leader-chart-layout"><div class="chart-scroll"><div id="race" role="img" aria-label="Animated ranking of monthly terminal passenger movements"></div></div><aside class="leader-summary" aria-label="Leading terminal"><span>TOP 1</span><strong id="leader">—</strong></aside></div><div class="player"><button id="play" class="primary" disabled>▶ Play</button><button id="reset" disabled>↺ Reset</button><label class="speed">Speed<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><div class="timeline"><label for="scrub" class="sr-only">Choose displayed month</label><input id="scrub" type="range" min="0" max="213" value="0" disabled><div><span id="rangeStart"></span><span id="rangeEnd"></span></div></div></div></section>
</section>
</main><script type="module" src="script.js?v=7"></script></body></html>
